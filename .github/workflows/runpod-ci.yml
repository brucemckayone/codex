name: RunPod Transcoder CI/CD

on:
  push:
    branches: [main]
    # The tag script names the image deploy-production.yml looks for, so a
    # change to it must publish under the new name.
    paths:
      - "infrastructure/runpod/**"
      - ".github/workflows/runpod-ci.yml"
      - ".github/scripts/runpod-image-tag.sh"
  # PRs land on dev, so dev is here too: without it the handler's unit tests
  # and the container verification only ran on the dev -> main promotion.
  pull_request:
    branches: [main, dev]
    paths:
      - "infrastructure/runpod/**"
      - ".github/workflows/runpod-ci.yml"
      - ".github/scripts/runpod-image-tag.sh"
  # Publishes a src- tag that no push published (one whose publish failed, or
  # a deleted package version). Publishing runs on main only.
  workflow_dispatch:

# Whole-workflow, so pushes to main publish in push order. That cannot change
# what a src- tag names: each one is written once (see "Publish image").
concurrency:
  group: runpod-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKING_DIR: infrastructure/runpod

jobs:
  quality-and-unit-test:
    name: Quality & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Black
        run: black --check .

      - name: Lint with Flake8
        run: flake8 .

      - name: Run Unit Tests
        run: pytest tests/unit --cov=handler --cov-report=xml

      # Publishing runs this on main only; here a broken script, or an input
      # it can no longer find, fails the PR instead.
      - name: Check the image tag inputs
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/runpod-image-tag.sh"

  container-verification:
    name: Container Integration Verification
    runs-on: ubuntu-latest
    needs: [quality-and-unit-test]

    permissions:
      contents: read
      packages: write # "Publish image", main only

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.WORKING_DIR }}
          load: true
          tags: test-worker:local
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix for cache growing forever
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Inner Container Verification
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/${{ env.WORKING_DIR }}/tests/integration:/app/tests/integration \
            --entrypoint python3 \
            test-worker:local \
            tests/integration/verify_cpu_transcode.py

      # --- Publish (main only) ---
      # The image published is the one verified above, not a second build.
      # Pointing the RunPod endpoint at it happens in deploy-production.yml,
      # under the `production` environment that holds the RunPod key and the
      # owner's approval (Codex-l2c48.2). This workflow used to deploy too: on
      # pull_request runs (unmerged code reached the prod endpoint on
      # 2026-02-11), and under a reviewer gate nobody saw, so every deploy since
      # July expired after 30 days.
      - name: Image tag
        id: tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          src=$(.github/scripts/runpod-image-tag.sh)
          echo "src=$src" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: steps.tag.outcome == 'success'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # src-<hash>: what deploy-production.yml looks for. sha-<commit>:
      # traceability. latest: the most recently built image, used only by
      # scripts/setup_endpoint.py to create an endpoint (the next production
      # deploy points it at the right src- tag).
      - name: Publish image
        if: steps.tag.outcome == 'success'
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/codex-transcoder
          SRC: ${{ steps.tag.outputs.src }}
        run: |
          repository="${REPOSITORY,,}"
          # Write-once. The tag is named from the inputs, but a rebuild can
          # still differ (floor-pinned pip, unversioned apt). Pushing over it
          # would change what production runs with no deploy: the template's
          # image name stays the same, so deploy-production skips it.
          missing=""
          for attempt in 1 2 3; do
            if answer=$(timeout 20 docker manifest inspect "$repository:$SRC" 2>&1); then
              echo "::notice title=Transcoder image unchanged::$repository:$SRC is already published, and is never rebuilt over."
              exit 0
            fi
            last=${answer##*$'\n'}
            case "$answer" in
              *"manifest unknown"* | *[Nn]"o such manifest"*)
                missing=yes
                break
                ;;
              *denied* | *unauthorized*)
                echo "::error title=Registry check failed::$repository:$SRC: $last. The package is missing, or this workflow cannot write it: check the package's Actions access in its GitHub settings."
                exit 1
                ;;
            esac
            echo "⏳ Registry check $attempt/3 failed: ${last:-timed out}"
            sleep 10
          done
          if [ -z "$missing" ]; then
            echo "::error title=Registry check failed::$repository:$SRC: ${last:-timed out}"
            exit 1
          fi
          # src last: it is the marker both the check above and
          # deploy-production read, so it exists only once the others do.
          for tag in "sha-$GITHUB_SHA" latest "$SRC"; do
            docker tag test-worker:local "$repository:$tag"
            docker push "$repository:$tag"
          done
