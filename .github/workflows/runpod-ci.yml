name: RunPod Transcoder CI/CD

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/runpod/**"
      - ".github/workflows/runpod-ci.yml"
  # PRs land on dev, so dev is here too: without it the handler's unit tests
  # and the container verification only ran on the dev -> main promotion.
  pull_request:
    branches: [main, dev]
    paths:
      - "infrastructure/runpod/**"
      - ".github/workflows/runpod-ci.yml"

# Whole-workflow, so pushes to main queue in push order: a job-level group is
# entered when the deploy job becomes ready, and a run with a faster build
# could deploy, then be overwritten by an older one.
concurrency:
  group: runpod-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKING_DIR: infrastructure/runpod

jobs:
  quality-and-unit-test:
    name: Quality & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Black
        run: black --check .

      - name: Lint with Flake8
        run: flake8 .

      - name: Run Unit Tests
        run: pytest tests/unit --cov=handler --cov-report=xml

  container-verification:
    name: Container Integration Verification
    runs-on: ubuntu-latest
    needs: [quality-and-unit-test]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.WORKING_DIR }}
          load: true
          tags: test-worker:local
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix for cache growing forever
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Inner Container Verification
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/${{ env.WORKING_DIR }}/tests/integration:/app/tests/integration \
            --entrypoint python3 \
            test-worker:local \
            tests/integration/verify_cpu_transcode.py

  deploy:
    name: Deploy to RunPod
    runs-on: ubuntu-latest
    needs: [container-verification]
    # Push to main only. A pull_request run used to deploy too, which put
    # unmerged handler code on the production endpoint (2026-02-11).
    if: github.event_name == 'push'
    # Its own environment, with no required reviewer: main is already gated by
    # the owner's dev -> main promotion. Under `production` every deploy since
    # July sat waiting for an approval and expired after 30 days (Codex-l2c48.2).
    environment: runpod-production

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Fail loudly, before anything is pushed. A missing secret used to skip
      # the endpoint update and leave the job green, so no deploy happened and
      # nothing said so.
      - name: Require deploy secrets
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$RUNPOD_ENDPOINT_ID" ]; then
            echo "::error::RUNPOD_API_KEY and RUNPOD_ENDPOINT_ID must be set on the runpod-production environment"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.WORKING_DIR }}
          push: true
          # ghcr.io/username/repo_name:tag
          tags: |
            ghcr.io/${{ github.repository_owner }}/codex-transcoder:latest
            ghcr.io/${{ github.repository_owner }}/codex-transcoder:sha-${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # NOTE: runpodctl is useless for this specific image update flow via script
      # so we skip installing it and just use the script.

      - name: Setup Python for deployment script
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install script deps
        run: pip install requests

      - name: Update RunPod Endpoint
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          # Pass the full base image path to the script so it can construct the tag
          DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/codex-transcoder
          IMAGE_TAG: sha-${{ github.sha }}
        run: python ${{ env.WORKING_DIR }}/scripts/update_runpod_endpoint.py

      # Its own step: red when the endpoint cannot take jobs (paused), while the
      # step above, which deployed the image, stays green.
      - name: Endpoint health
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: python ${{ env.WORKING_DIR }}/scripts/update_runpod_endpoint.py --health
