name: Visual Regression

on:
  workflow_dispatch: # Allow manual triggers
  # Uncomment below when visual tests are ready
  # pull_request:
  #   paths:
  #     - 'apps/web/src/lib/components/**'
  #     - 'apps/web/src/lib/styles/**'

jobs:
  visual:
    # ubuntu-24.04, not -latest: Playwright ^1.56 refuses ubuntu-26.04
    # ("does not support chromium on ubuntu26.04-x64"), which -latest
    # became after 11-12. Unpin when Playwright supports it (Codex-wxfj8).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm --filter web build-storybook

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Storybook
        run: npx http-server apps/web/storybook-static -p 6006 &

      - name: Wait for Storybook
        run: npx wait-on http://localhost:6006 --timeout 60000

      - name: Run visual tests
        run: pnpm --filter web exec playwright test tests/visual tests/a11y

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: visual-diff
          path: apps/web/test-results/
