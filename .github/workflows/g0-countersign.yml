name: G0 countersign

# The architecture gate's countersign check, judged by the BASE branch's copy
# of the gate (Codex-xtcfl, owner decision 2026-11-18).
#
# The static-analysis job runs the PR's own copy of the gate, so a PR that
# edits the gate could exempt itself: deleting one line from its list of gate
# files skipped the countersign that very edit owed. A pull_request_target
# workflow always runs from the base branch's definition, so the PR can't edit
# this job, and the job runs the base's scripts/checks over the PR's files as
# DATA: node only, no `pnpm install`, nothing from the PR is executed, a
# read-only token, no secrets.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: g0-countersign-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  countersign:
    name: Architecture gate countersigns (judged by the base's gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The base branch: the gate that judges.
      - uses: actions/checkout@v5
        with:
          path: base
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      # The PR beside it, as files to read. Nothing in it is run.
      - name: Check out the pull request as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C base fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          git -C base worktree add --detach ../pr "$HEAD_SHA"

      - name: Countersigns, judged by the base's gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MERGE_BASE="$(git -C pr merge-base HEAD "$BASE_SHA")"
          node base/scripts/checks/check-architecture.mjs --root pr --raises "$MERGE_BASE"
