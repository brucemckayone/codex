name: Static Analysis

on:
  workflow_call: # Only run when called by other workflows

permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo local cache - uses content-based hashing for better cache hits
      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/package.json') }}-
            ${{ runner.os }}-turbo-

      - name: Biome Check (Lint & Format)
        run: pnpm check:ci

      # Codex-2g7jj: the workflow setup-order gate.
      #
      # `actions/setup-node` v5 added `package-manager-cache` (default: true),
      # which resolves the pnpm store INSIDE the action and therefore needs pnpm
      # already on PATH. PR #505's Node 24 action bump left two workflows still
      # running `pnpm/action-setup` AFTER setup-node, and Production Deployment
      # #722 failed at step 2 with "Unable to locate executable file: pnpm" —
      # migrations, secrets and all 9 worker deploys skipped.
      #
      # The two that broke, deploy-production.yml and seed-dev-db.yml, are
      # exactly the two workflows NO CI job executes (workflow_run and
      # workflow_dispatch). The seven that survived set `cache: 'pnpm'`, which
      # v4 already required, and that had forced the ordering by side effect.
      # So the invariant was held by an unrelated input, in the files CI happens
      # to run. This gate asserts it directly, over every workflow file
      # including the unexecuted ones.
      #
      # Not actionlint's job (option 2 on the bead): the broken form is valid
      # YAML with valid inputs, so a schema linter passes it. This is a
      # SEMANTIC ordering rule.
      #
      # Belongs in THIS job: zero dependencies, no database, ~50ms. Neither
      # caller of this reusable workflow (testing.yml, main-gate.yml) applies a
      # path filter to it, so a diff touching only .github/workflows cannot
      # skip the gate that validates .github/workflows.
      #
      # Self-test first, so a regression that breaks the gate itself surfaces
      # before we trust its verdict — same reasoning as the two gates below.
      # Its must-catch cases are anchored on the real pre-fix bytes from
      # ded82d70^, not a synthetic approximation, and it is mutation-tested.
      - name: Workflow setup-order gate self-test
        run: node --test scripts/checks/check-workflow-setup-order.test.mjs

      - name: Workflow setup-order gate (pnpm before setup-node)
        run: node scripts/checks/check-workflow-setup-order.mjs

      # Codex-cijzb WP-0.2 / Codex-2pryk.1.4: the heavy editor UIs
      # ($lib/components/brand-editor, $lib/components/page-builder) must never
      # be statically imported by public-bundle code — any public route file OR
      # any $lib module (incl. the public page renderer $lib/page-builder) — as
      # that bundles the editor into the public chunk. See
      # apps/web/scripts/check-brand-editor-boundary.mjs for the full rule.
      # Self-test first so a regression that breaks the gate itself is caught
      # before we trust its verdict.
      - name: Import boundary gate self-test
        run: pnpm --filter web run check:brand-boundary:test

      - name: Public-bundle editor import boundary check
        run: pnpm --filter web run check:brand-boundary

      # Codex-ea1hd WP9: the data-access contract drift gate.
      #
      # Two grep-based rules over packages/*/src, workers/*/src and apps/*/src:
      #   RULE 3  no hand-written Cache-Control outside CACHE_PRESETS
      #           (@codex/constants). The leak class is `s-maxage` on a body
      #           that can vary by viewer — shared caches key on URL and NEVER
      #           on Cookie, which is how DYNAMIC_PUBLIC_REVALIDATE shipped.
      #   RULE 4  no floating KV write. A Workers response cancels an in-flight
      #           promise nothing is holding, so `kv.put(...).catch(() => {})`
      #           silently never happens and has no failure signal.
      # Checks 1 and 2 of that bead are enforced by the type system instead
      # (procedure/types.ts CachePolicyRule + the private default), and check 5
      # lands with WP6. The script's header comment is the full rationale.
      #
      # THE GATE HAS NO EXEMPTION LIST AND MUST NOT BE GIVEN ONE. If it fails,
      # the fix is at the call site: declare a CACHE_PRESETS name, or add a new
      # preset (with its reasoning) to packages/constants/src/limits.ts.
      #
      # Belongs in THIS job, not the test job: zero dependencies, no database,
      # ~1s. Neither caller of this reusable workflow (testing.yml,
      # main-gate.yml) applies a path filter to it, so the gate cannot be
      # skipped by a diff that touches only the files it scans.
      #
      # Self-test first, so a regression that breaks the gate itself surfaces
      # before we trust its verdict — same reasoning as the boundary gate above.
      - name: Data-access contract gate self-test
        run: node --test scripts/checks/check-data-access-contract.test.mjs

      - name: Data-access contract gate (Cache-Control + KV writes + search inputs)
        run: node scripts/checks/check-data-access-contract.mjs

      - name: Generate Paraglide i18n files
        run: pnpm --filter web exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide

      - name: Type check with Turborepo
        run: pnpm typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
