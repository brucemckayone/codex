name: Static Analysis

on:
  workflow_call: # Only run when called by other workflows

permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    # About 2x the p95 of 40 green runs (4.5 min) was 15. The svelte-check
    # step (Codex-3ckzk) then took a 20-minute timeout of its own, which a
    # 15-minute job would cut short, so the job allows the two together. Set
    # both from CI's measured p95 once there is one. It lives here because a
    # job that calls a reusable workflow (`uses:`) cannot set it (Codex-j7x4u).
    timeout-minutes: 30
    steps:
      # Full history: the architecture gate's --ci reads the change's own
      # commits (their G0-RAISE countersigns) and diffs against its base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # Codex-xtcfl (G0): the architecture gate. One runner, one rule registry
      # (scripts/checks/architecture-rules.mjs) and one ratchet baseline; the
      # rules page docs/architecture/rules.md is generated from the registry.
      # Its CI-GATES rule keeps the list of gates in that registry equal to the
      # run: steps of THIS job, so a new gate step must be added there too.
      # Keep every gate step on one line: a multi-line run block can't be
      # matched and fails CI-GATES.
      #
      # --ci also fails a fix this change made but didn't bank, a pin spent
      # beyond what the base still had, and any loosening (a raised baseline
      # pin, a new exception, a change to what a gate runs) the owner hasn't
      # countersigned with a G0-RAISE: trailer. When the change edits
      # scripts/checks/, the BASE commit's copy of the gate (git archive, run
      # from a temp dir) judges the countersigns too, so a PR can't approve
      # its own gate edit. That needs the base's history: fetch-depth 0 above.
      # It runs BEFORE pnpm install: the gate needs no dependencies, and no
      # install lifecycle script can touch it first. No `if:`: CI-GATES fails
      # a conditional gate step.
      - name: Architecture gate self-test
        run: node --test scripts/checks/check-architecture.test.mjs

      - name: Architecture gate (registry rules, ratchet baseline, countersigns)
        run: node scripts/checks/check-architecture.mjs --ci

      # WF-BD-CLOSE (W0): the PreToolUse hook that refuses to close an epic
      # before its retro. CI can't run a hook, so it proves the guard (bd is
      # stubbed) and that the tracked .claude/settings.json still wires it.
      - name: bd-close guard self-test
        run: node --test scripts/checks/bd-close-guard.test.mjs

      - name: bd-close guard is wired in .claude/settings.json
        run: node scripts/checks/bd-close-guard.mjs --check-wiring

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo local cache - uses content-based hashing for better cache hits
      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/package.json') }}-
            ${{ runner.os }}-turbo-

      - name: Biome Check (Lint & Format)
        run: pnpm check:ci

      # Codex-2g7jj: the workflow setup-order gate.
      #
      # `actions/setup-node` v5 added `package-manager-cache` (default: true),
      # which resolves the pnpm store INSIDE the action and therefore needs pnpm
      # already on PATH. PR #505's Node 24 action bump left two workflows still
      # running `pnpm/action-setup` AFTER setup-node, and Production Deployment
      # #722 failed at step 2 with "Unable to locate executable file: pnpm" —
      # migrations, secrets and all 9 worker deploys skipped.
      #
      # The two that broke, deploy-production.yml and seed-dev-db.yml, are
      # exactly the two workflows NO CI job executes (workflow_run and
      # workflow_dispatch). The seven that survived set `cache: 'pnpm'`, which
      # v4 already required, and that had forced the ordering by side effect.
      # So the invariant was held by an unrelated input, in the files CI happens
      # to run. This gate asserts it directly, over every workflow file
      # including the unexecuted ones.
      #
      # Not actionlint's job (option 2 on the bead): the broken form is valid
      # YAML with valid inputs, so a schema linter passes it. This is a
      # SEMANTIC ordering rule.
      #
      # Belongs in THIS job: zero dependencies, no database, ~50ms. Neither
      # caller of this reusable workflow (testing.yml, main-gate.yml) applies a
      # path filter to it, so a diff touching only .github/workflows cannot
      # skip the gate that validates .github/workflows.
      #
      # Self-test first, so a regression that breaks the gate itself surfaces
      # before we trust its verdict — same reasoning as the two gates below.
      # Its must-catch cases are anchored on the real pre-fix bytes from
      # ded82d70^, not a synthetic approximation, and it is mutation-tested.
      - name: Workflow setup-order gate self-test
        run: node --test scripts/checks/check-workflow-setup-order.test.mjs

      - name: Workflow setup-order gate (pnpm before setup-node)
        run: node scripts/checks/check-workflow-setup-order.mjs

      # Codex-cijzb WP-0.2 / Codex-2pryk.1.4: the heavy editor UIs
      # ($lib/components/brand-editor, $lib/components/page-builder) must never
      # be statically imported by public-bundle code — any public route file OR
      # any $lib module (incl. the public page renderer $lib/page-builder) — as
      # that bundles the editor into the public chunk. See
      # apps/web/scripts/check-brand-editor-boundary.mjs for the full rule.
      # Self-test first so a regression that breaks the gate itself is caught
      # before we trust its verdict.
      - name: Import boundary gate self-test
        run: pnpm --filter web run check:brand-boundary:test

      - name: Public-bundle editor import boundary check
        run: pnpm --filter web run check:brand-boundary

      # Codex-vlphc.1 (epic Codex-2yvc8): every modal is built from the
      # shared Dialog parts. Dialog.Content clips at 85vh and only
      # Dialog.Body scrolls, so a page's own wrapper between the two hid the
      # tier and FAQ dialogs' buttons on a short screen, and e2e could not
      # see it (Playwright scrolls in code). The gate parses every .svelte
      # file and fails on a non-part child of Content or Form, a :global()
      # restyle of the Dialog, or a hand-rolled role="dialog". Its allowlist
      # empties as the epic lands. See
      # apps/web/scripts/check-dialog-structure.mjs for the full rule.
      # Self-test first, as for the boundary gate above.
      - name: Dialog structure gate self-test
        run: pnpm --filter web run check:dialog-structure:test

      - name: Dialog structure gate (shared Dialog parts only)
        run: pnpm --filter web run check:dialog-structure

      # Codex-if444: a read that failed is retried through the shared
      # LoadFailedAlert, never by hand. Kit drops a $derived query whose read
      # failed and hands the page a NEW one, so a Retry that awaits
      # `X.refresh()` waits on the stray read and judges the wrong query
      # (Monetisation and Subscribers called a repeat failure a success); a
      # load read's awaited `invalidate()` resolves late or early. The gate
      # fails on LoadFailedAlert's Retry label used anywhere else, and on a
      # handler pressed from a failed state whose first await refreshes a
      # $derived remote read. Its allowlist empties as the copies migrate. See
      # apps/web/scripts/check-load-retry.mjs for the full rule.
      # Self-test first, as for the gates above.
      - name: Load-failure Retry gate self-test
        run: pnpm --filter web run check:load-retry:test

      - name: Load-failure Retry gate (shared LoadFailedAlert only)
        run: pnpm --filter web run check:load-retry

      # Codex-1yd58 WP-2: the output door. A ShaderHero renderer reaches the
      # screen only through bindOutput(gl) (ShaderHero/output-target.ts), the
      # seam the Showreel compositor (WP-3, not built yet) will redirect to its
      # scene framebuffer. A raw bindFramebuffer(FRAMEBUFFER, null) still draws
      # today, and would then draw behind the compositor's back. Text-only (no glslang);
      # see apps/web/scripts/check-output-door.mjs. Self-test first.
      - name: Output-door gate self-test
        run: pnpm --filter web run check:output-door:test

      - name: Output-door gate (ShaderHero draws through bindOutput)
        run: pnpm --filter web run check:output-door

      # Codex-1yd58 WP-8: the shader gate. A GLSL error is invisible to tsc,
      # biome and the unit tests (a shader is a string until a browser
      # compiles it, and fails as a black canvas), so every ShaderHero preset
      # and compositor pass is compiled with glslang, and each compositor
      # layer is RUN in headless Chrome on SwiftShader and must draw its input
      # unchanged at amount 0. glslang is not on the runner, so apt installs
      # it (glslang-tools, 15.1 on 24.04, compiles all 52 sources). The
      # runner's own Chrome runs the layers: no Playwright browser download.
      # CI=true (set by Actions) makes a missing browser or WebGL2 a FAILURE,
      # never a skip. See apps/web/scripts/validate-shaders.mjs.
      # The gate's text checks (glsl-source.mjs: the smoothstep edge rule on
      # every preset source and compositor pass), planted cases first.
      - name: Shader gate self-test
        run: pnpm --filter web run shaders:check:test

      # Codex-1yd58 WP-6: the Showreel's 480 film passes (each film frame with
      # every motion effect), as text: no effect declares its own uniform,
      # none reads one the compositor never sets, no two share a pass id (the
      # program cache key), no flashing effect reads the real clock. Planted
      # cases first, then the REAL passes, bundled with esbuild and checked
      # with no glslang, so a registry fault fails here in seconds. The
      # shader gate below runs these checks again and compiles every pass.
      # See apps/web/scripts/shader-gate.mjs.
      - name: Film pass gate self-test
        run: pnpm --filter web run shaders:gate:test

      - name: Film pass gate (the real passes, as text)
        run: pnpm --filter web run shaders:gate

      - name: Install glslang (GLSL compiler for the shader gate)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends glslang-tools

      - name: Shader gate (GLSL compiles; each layer draws its input at amount 0)
        env:
          SHADERS_CHROME: /usr/bin/google-chrome
        run: pnpm --filter web run shaders:check

      # Codex-1yd58 WP-11: the e2e suite finds the web app through ONE helper,
      # apps/web/e2e/helpers/origin.ts (PLAYWRIGHT_BASE_URL or the default),
      # and each worker through SERVICE_PORTS (@codex/constants). A port
      # written anywhere else under e2e/ breaks a run against another dev
      # server (the epic worktree's :3000) or a moved worker. Text-only; see
      # apps/web/scripts/check-e2e-ports.mjs. Self-test first.
      - name: E2E origin gate self-test
        run: pnpm --filter web run check:e2e-ports:test

      - name: E2E origin gate (no hardcoded app or worker port under e2e/)
        run: pnpm --filter web run check:e2e-ports

      # Codex-ea1hd WP9: the data-access contract drift gate.
      #
      # Two grep-based rules over packages/*/src, workers/*/src and apps/*/src:
      #   RULE 3  no hand-written Cache-Control outside CACHE_PRESETS
      #           (@codex/constants). The leak class is `s-maxage` on a body
      #           that can vary by viewer — shared caches key on URL and NEVER
      #           on Cookie, which is how DYNAMIC_PUBLIC_REVALIDATE shipped.
      #   RULE 4  no floating KV write. A Workers response cancels an in-flight
      #           promise nothing is holding, so `kv.put(...).catch(() => {})`
      #           silently never happens and has no failure signal.
      # Checks 1 and 2 of that bead are enforced by the type system instead
      # (procedure/types.ts CachePolicyRule + the private default), and check 5
      # lands with WP6. The script's header comment is the full rationale.
      #
      # THE GATE HAS NO EXEMPTION LIST AND MUST NOT BE GIVEN ONE. If it fails,
      # the fix is at the call site: declare a CACHE_PRESETS name, or add a new
      # preset (with its reasoning) to packages/constants/src/limits.ts.
      #
      # Belongs in THIS job, not the test job: zero dependencies, no database,
      # ~1s. Neither caller of this reusable workflow (testing.yml,
      # main-gate.yml) applies a path filter to it, so the gate cannot be
      # skipped by a diff that touches only the files it scans.
      #
      # Self-test first, so a regression that breaks the gate itself surfaces
      # before we trust its verdict — same reasoning as the boundary gate above.
      - name: Data-access contract gate self-test
        run: node --test scripts/checks/check-data-access-contract.test.mjs

      - name: Data-access contract gate (Cache-Control + KV writes + search inputs)
        run: node scripts/checks/check-data-access-contract.mjs

      - name: Generate Paraglide i18n files
        run: pnpm --filter web exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide

      - name: Type check with Turborepo
        run: pnpm typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      # Codex-3ckzk: svelte-check against a committed baseline.
      #
      # The typecheck above is tsc, which never reads a .svelte file, so a type
      # error inside a component, or a type-level guard written for its
      # consumers (Dialog.Content's CssLength-typed maxHeight), failed no job.
      # svelte-check reads them, but the tree carries a standing set of errors.
      # So the gate counts svelte-check's errors per (file, code) and compares
      # them with apps/web/scripts/svelte-check-baseline.json: a NEW error
      # fails, and so does a STALE entry (an error fixed but still listed), so
      # the baseline only shrinks. The script's header says how to shrink it.
      #
      # After the typecheck on purpose: svelte-check resolves the workspace
      # packages through their dist/ types, which turbo's ^build has just
      # written, and reads the paraglide output compiled above. The gate's own
      # `svelte-kit sync` writes the route types.
      #
      # Self-test first, as for the gates above.
      - name: svelte-check baseline gate self-test
        run: pnpm --filter web run check:svelte-baseline:test

      # 20 minutes until CI's own runs give a p95: a local run took 273-1039 s
      # under load, and a step that times out reads like a failure.
      - name: svelte-check (no error beyond the baseline)
        run: pnpm --filter web run check:svelte-baseline
        timeout-minutes: 20
